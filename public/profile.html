<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/base.css">
  <script src="/js/common/theme.js"></script>
  <title>โปรไฟล์ - UniVibe</title>
</head>
<body>
  <header id="topbar"></header>
  <main class="container">
    <section class="card profile-card" id="profile"></section>
    <div class="profile-tabs" id="profile-tabs" role="tablist">
      <button class="profile-tab active" role="tab" id="ptab-posts" aria-selected="true" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 5h16v3H4zm0 5.5h16v3H4zM4 16h16v3H4z"/></svg> โพสต์</button>
      <button class="profile-tab" role="tab" id="ptab-photos" aria-selected="false" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0h7v7h-7z"/></svg> รูป</button>
    </div>
    <div id="posts"></div>
    <div id="photos" class="hidden">
      <div id="photo-grid" class="photo-grid"></div>
      <p id="photo-empty" class="muted hidden" style="text-align:center;padding:24px">ยังไม่มีรูปภาพ</p>
      <button type="button" id="photo-more" class="btn btn-ghost btn-sm hidden" style="margin:12px auto;display:block;width:auto">โหลดเพิ่ม</button>
    </div>
  </main>
  <script src="/js/common/api.js"></script>
  <script src="/js/common/ui.js"></script>
  <script src="/js/common/imagePicker.js"></script>
  <script src="/js/common/layout.js"></script>
  <script src="/js/common/notifications.js"></script>
  <script src="/js/common/postCard.js"></script>
  <script src="/js/pages/profile.js"></script>
</body>
</html>
