<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/base.css">
  <script src="/js/common/theme.js"></script>
  <title>ลืมรหัสผ่าน - UniVibe</title>
</head>
<body>
  <header class="topbar">
    <span class="logo-badge"><img src="/assets/logo-full.png" alt="UniVibe"></span>
    <button class="btn btn-ghost btn-sm" type="button" data-theme-toggle>โหมดมืด</button>
  </header>

  <main class="auth-wrap">
    <section class="card">
      <h1>ลืมรหัสผ่าน</h1>
      <p class="muted">ยืนยันตัวตนด้วยรหัสนักศึกษาและวันเกิด แล้วตั้งรหัสผ่านใหม่ (สำหรับนักศึกษา/ศิษย์เก่า)</p>
      <form id="reset-form" novalidate>
        <div class="field">
          <label for="studentId">รหัสนักศึกษา</label>
          <input type="text" id="studentId" name="studentId" inputmode="numeric" maxlength="9" required>
        </div>
        <div class="field">
          <label for="birthDate">วันเกิด</label>
          <input type="date" id="birthDate" name="birthDate" required>
        </div>
        <div class="field">
          <label for="newPassword">รหัสผ่านใหม่</label>
          <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required>
          <span class="hint">อย่างน้อย 8 ตัวอักษร</span>
        </div>
        <div class="field">
          <label for="confirm">ยืนยันรหัสผ่านใหม่</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
        </div>
        <p id="message" class="alert" role="alert"></p>
        <button class="btn" type="submit">ตั้งรหัสผ่านใหม่</button>
      </form>
      <div class="form-links">
        <a href="/login.html">กลับไปเข้าสู่ระบบ</a>
      </div>
    </section>
  </main>

  <script src="/js/common/api.js"></script>
  <script src="/js/pages/forgot.js"></script>
</body>
</html>
