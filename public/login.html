<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/base.css">
  <script src="/js/common/theme.js"></script>
  <title>เข้าสู่ระบบ - UniVibe</title>
</head>
<body>
  <header class="topbar">
    <span class="logo-badge"><img src="/assets/logo-full.png" alt="UniVibe"></span>
    <button class="btn btn-ghost btn-sm" type="button" data-theme-toggle>โหมดมืด</button>
  </header>

  <main class="auth-wrap">
    <section class="card">
      <h1>เข้าสู่ระบบ</h1>
      <p class="muted">ยินดีต้อนรับสู่ชุมชน UniVibe</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">username</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <p id="message" class="alert" role="alert"></p>
        <button class="btn" type="submit">เข้าสู่ระบบ</button>
      </form>
      <div class="form-links">
        <a href="/register.html">สมัครสมาชิก</a>
        <a href="/forgot.html">ลืมรหัสผ่าน?</a>
      </div>
    </section>
  </main>

  <script src="/js/common/api.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
